<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Availability | Niko's Numismatic Novelties</title>
    <link rel="shortcut icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style1.css">
    <meta name="keywords" content="coins,bookmarks,keychains">
    <meta name="description" content="Niko's Numismatic Novelties is a small business that produces products featuring coins.">
</head>
<body>
    <header id="nav">
        <img src="NNN logo.jpeg" alt="Niko's Numismatic Novelites" height="40">
        <span class="business-name" role="heading">Niko's Numismatic Novelties</span>
        <span id="options" onclick="document.getElementById('status').click();"><img src="menu.png" alt="Menu"></span>
        <input type="checkbox" id="status">
        <nav>
            <a href="/">Home</a>
            <a href="/products/">Products</a>
            <a href="/markets/">Markets</a>
            <a href="/availability.html">Availability</a>
        </nav>
    </header>
     <script src="/navigation.js"></script>
    <div id="content">
        <h1>Availability</h1>
        <table id="table">
            <tr><th>Product</th><th>Status</th><th>Availability</th></tr>
        </table>
        <script>
            let data2;
            fetch('https://numismaticnovelties.github.io/availability.json')
            .then(response => {
                if (!response.ok) {
                    console.log(`HTTP error! status: ${response.status}`);
                }
                // Check if response has content
                return response.text(); // Get as text first
                })
            .then(text => {
            if (!text) {
            console.error('Empty response received');
            return;
            }
            data2 = JSON.parse(text); // Parse manually
            display(data2);
            })
            .catch(error => console.error('Fetch error:', error));
            function display(fetchedData){
                data2 = fetchedData;
                data2.keys.forEach((value)=>{
                    let row = document.createElement('tr');
                    let item = data2[value];
                    row.innerHTML = `<th>${item.name}</th><td data-status="${item.status}">${item.status}</td><td>${item.available}</td>`;
                    document.getElementById('table').appendChild(row);
                })
            }
        </script>
    </div>
</body>
</html>
