<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="t">Product | Niko's Numismatic Novelties</title>
    <link rel="shortcut icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style1.css">
    <meta name="keywords" content="coins,bookmarks,keychains">
    <meta name="description" content="Niko's Numismatic Novelties is a small business that produces products featuring coins.">
</head>
<body>
    <header id="nav">
        <img src="NNN logo.jpeg" alt="Niko's Numismatic Novelites" height="40">
        <span class="business-name" role="heading">Niko's Numismatic Novelties</span>
        <span id="options" onclick="document.getElementById('status').click();"><img src="menu.png" alt="Menu"></span>
        <input type="checkbox" id="status">
        <nav>
            <a href="/">Home</a>
            <a href="products/">Products</a>
            <a href="/markets/">Markets</a>
        </nav>
    </header>
    <div id="content">
        <h1 id="name">Product Name Loading...</h1>
        <img src="" alt="Product Photo Not Available" id="img" onerror="this.src = '/placeholder.jpeg';this.onerror=null;">
        <table>
            <tr><th>Availability</th><td id="availability">Availability loading...</td></tr>
        </table>
        <script>
            let key = location.search.split('=');
            fetch('https://numismaticnovelties.github.io/availability.html').then((response)=>{
                return response.json();
            }).then((json)=>{
                let jsonData = JSON.parse(json)[key];
                //load title
                document.getElementById('t').innerHTML = jsonData.name + "| Niko's Numismatic Novelties";
                //load product name
                document.getElementById('name').innerHTML = jsonData.name;
                //load image
                if (jsonData.img){
                    document.getElementById('img').src = jsonData.img;
                }
                //load availability
                document.getElementById('availability').outerHTML = `<tr data-status="${jsonData.status}">${jsonData.available}></tr>`;
            })
        </script>
    </div>
     <script src="/navigation.js"></script>
</body>
</html>
