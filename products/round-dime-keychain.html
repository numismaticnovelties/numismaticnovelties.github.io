<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Niko's Numismatic Novelties</title>
    <link rel="shortcut icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="NNN logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style1.css">
    <meta name="keywords" content="coins,bookmarks,keychains">
    <meta name="description" content="Niko's Numismatic Novelties is a small business that produces products featuring coins.">
</head>
<body>
    <header id="nav">
        <img src="NNN logo.jpeg" alt="Niko's Numismatic Novelites" height="40">
        <span class="business-name" role="heading">Niko's Numismatic Novelties</span>
        <span id="options" onclick="document.getElementById('status').click();"><img src="menu.png" alt="Menu"></span>
        <input type="checkbox" id="status">
        <nav>
            <a href="/">Home</a>
            <a href="products/">Products</a>
            <a href="/markets/">Markets</a>
        </nav>
    </header>
    <div id="content">
        <h1>Round Dime Keychains</h1>
        <table>
            <tr><th>Status</th><td data-status="Production" id="status">Production</td></tr>
            <tr><th>Quantity</th><td id="quantity">12</td></tr>
        </table>
        <script>
            fetch('/availability.json').then((response)=>{
                return response.json();
            }).then((json)=>{
                const statusData = JSON.parse(json);
                document.getElementById('status').innerHTML = statusData[9].status;
                document.getElementById('status').dataset.status = statusData[9].status;
                document.getElementById('quantity').innerHTML = statusData[9].available;
            })
        </script>
    </div>
    <script src="/navigation.js"></script>
</body>
</html>
